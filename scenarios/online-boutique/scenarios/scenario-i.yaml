name: "Scenario I: Full-mesh upgrade storm"
description: >
  Six services upgrade at once; recommendation stays at v1 and becomes
  the lynchpin. productcatalog v2 widens the categories response enum,
  and bidirectional compat clauses cascade the exclusion through
  frontend, checkout, and currency — four services removed from the MSS.
  Shipping v3 and email v2 survive (optional-only response additions,
  no violation-linked edges with the excluded cluster).
baseline:
  frontend: v1
  checkout: v1
  shipping: v1
  productcatalog: v1
  currency: v1
  email: v1
  recommendation: v1
upgrades:
  frontend: v2
  checkout: v3
  shipping: v3
  productcatalog: v2
  currency: v2
  email: v2
expect:
  gus: FAIL
  mss: [shipping, email]
  breaks:
    - edge: recommendation->productcatalog
      rule: enum-response-widening
    - edge: frontend->checkout
      rule: REQ.1
    - edge: frontend->checkout
      rule: prim-mismatch
    - edge: checkout->currency
      rule: RES.1
    - edge: frontend->currency
      rule: REQ.1
