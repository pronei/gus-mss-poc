name: "Scenario F: Recursive category tree"
description: >
  ProductCatalog v3 replaces the flat categories string enum with a
  recursive Category{name, children: [Category]} object tree. This is a
  type kind change (enum -> array) that exercises the coinductive Ref
  handling in the compat checker. JSON Schema validators can validate
  documents against either schema version, but cannot compare the two
  versions for cross-version compatibility during rolling deployment.
baseline:
  frontend: v1
  productcatalog: v1
upgrades:
  productcatalog: v3
expect:
  gus: FAIL
  breaks_exact: true
  breaks:
    - edge: checkout->productcatalog
      rule: kind-mismatch
    - edge: frontend->productcatalog
      rule: kind-mismatch
    - edge: recommendation->productcatalog
      rule: kind-mismatch
