openapi: "3.0.0"
info:
  title: Shipping Service
  version: "2.0"
paths:
  /shipping/quote:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address, items]
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                priority:
                  type: string
                  # v2: replaced "express" with "same-day"
                  enum: [standard, same-day]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [cost_usd]
                properties:
                  cost_usd:
                    $ref: '#/components/schemas/Money'
  /shipping/ship:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address, items]
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [tracking_id]
                properties:
                  tracking_id:
                    type: string
components:
  schemas:
    Address:
      type: object
      required: [street_address, city, country, zip_code]
      properties:
        street_address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zip_code:
          type: string
    CartItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          format: int32
    Money:
      type: object
      required: [currency_code, units, nanos]
      properties:
        currency_code:
          type: string
        units:
          type: integer
          format: int64
        nanos:
          type: integer
          format: int32
