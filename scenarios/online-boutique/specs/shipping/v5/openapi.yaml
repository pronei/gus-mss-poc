openapi: "3.0.0"
info:
  title: Shipping Service
  version: "5.0"
  description: >
    Promo codes at quote time: accepts an optional discount_code from a
    fixed set. Safe against every old caller — the hazard only appears
    in the (new,new) target state with frontend v7's free-string codes.
paths:
  /shipping/quote:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address, items, priority, account_tier]
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                priority:
                  type: string
                  enum: [standard, express]
                account_tier:
                  type: string
                discount_code:
                  type: string
                  enum: [SAVE10, SAVE20]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [cost_usd]
                properties:
                  cost_usd:
                    $ref: '#/components/schemas/Money'
                  estimated_delivery:
                    type: string
  /shipping/ship:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address, items]
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [tracking_id]
                properties:
                  tracking_id:
                    type: string
components:
  schemas:
    Address:
      type: object
      required: [street_address, city, country, zip_code]
      properties:
        street_address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zip_code:
          type: string
    CartItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          format: int32
    Money:
      type: object
      required: [currency_code, units, nanos]
      properties:
        currency_code:
          type: string
        units:
          type: integer
          format: int64
        nanos:
          type: integer
          format: int32
