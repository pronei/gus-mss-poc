openapi: "3.0.0"
info:
  title: Checkout Service
  version: "4.0"
  description: >
    Accounts push: quote sends guarantee priority and account_tier;
    confirmation calls now carry shipment_ref (the shipment-tracking
    identity); formalizes /charge and /convert outbound contracts.
paths:
  /placeorder:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, address, items, credit_card]
              properties:
                email:
                  type: string
                  format: email
                address:
                  $ref: '#/components/schemas/Address'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                credit_card:
                  $ref: '#/components/schemas/CreditCard'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResult'
  # --- outbound calls this service makes ---
  /shipping/quote:
    post:
      x-role: client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address, items, priority, account_tier]
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                priority:
                  type: string
                  enum: [standard, express]
                account_tier:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [cost_usd]
                properties:
                  cost_usd:
                    $ref: '#/components/schemas/Money'
  /send-order-confirmation:
    post:
      x-role: client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_id, email, order, shipment_ref]
              properties:
                order_id:
                  type: string
                  x-provides: "order-identity"
                shipment_ref:
                  type: string
                  x-provides: "shipment-tracking"
                email:
                  type: string
                  format: email
                order:
                  $ref: '#/components/schemas/OrderResult'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /charge:
    post:
      x-role: client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [amount, credit_card]
              properties:
                amount:
                  $ref: '#/components/schemas/Money'
                credit_card:
                  $ref: '#/components/schemas/CreditCard'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [transaction_id, status]
                properties:
                  transaction_id:
                    type: string
                  status:
                    type: string
                    enum: [approved, declined]
  /convert:
    post:
      x-role: client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [from, to_code]
              properties:
                from:
                  $ref: '#/components/schemas/Money'
                to_code:
                  type: string
                memo:
                  type: string
                  nullable: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Money'
components:
  schemas:
    OrderResult:
      type: object
      required: [order_id, shipping_tracking_id, shipping_cost, items]
      properties:
        order_id:
          type: string
        shipping_tracking_id:
          type: string
        shipping_cost:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    Address:
      type: object
      required: [street_address, city, country, zip_code]
      properties:
        street_address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zip_code:
          type: string
    CartItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          format: int32
    CreditCard:
      type: object
      required: [number, cvv, expiration_year, expiration_month]
      properties:
        number:
          type: string
        cvv:
          type: integer
        expiration_year:
          type: integer
        expiration_month:
          type: integer
    Money:
      type: object
      required: [currency_code, units, nanos]
      properties:
        currency_code:
          type: string
        units:
          type: integer
          format: int64
        nanos:
          type: integer
          format: int32
