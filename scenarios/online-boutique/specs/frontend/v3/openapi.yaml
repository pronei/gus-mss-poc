openapi: "3.0.0"
info:
  title: Frontend Service
  version: "3.0"
  description: >
    Co-developed with checkout v3: sends the new idempotency_key and
    expects order_id as integer in the OrderResult.
paths:
  # Outbound call to checkout (the browser-facing inbound is out of mesh scope).
  /placeorder:
    post:
      x-role: client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, address, items, credit_card, idempotency_key]
              properties:
                idempotency_key:
                  type: string
                email:
                  type: string
                  format: email
                address:
                  $ref: '#/components/schemas/Address'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                credit_card:
                  $ref: '#/components/schemas/CreditCard'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResult'
  /products:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  # --- outbound calls this service makes ---
  /shipping/quote:
    post:
      x-role: client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address, items]
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                priority:
                  type: string
                  # v2: narrows its own sends to the intersection of every
                  # shipping version's accept set — safe against shipping
                  # v1 ({standard,express}) and v2 ({standard,same-day}).
                  enum: [standard]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [cost_usd]
                properties:
                  cost_usd:
                    $ref: '#/components/schemas/Money'
components:
  schemas:
    OrderResult:
      type: object
      required: [order_id, shipping_tracking_id, shipping_cost, items]
      properties:
        order_id:
          type: integer
        shipping_tracking_id:
          type: string
        shipping_cost:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    Product:
      type: object
      required: [id, name, description, categories]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        categories:
          type: string
          enum:
            - clothing
            - accessories
            - footwear
            - decor
            - kitchen
            - vintage
            - garden
            - electronics
            - music
    Address:
      type: object
      required: [street_address, city, country, zip_code]
      properties:
        street_address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zip_code:
          type: string
    CartItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          format: int32
    CreditCard:
      type: object
      required: [number, cvv, expiration_year, expiration_month]
      properties:
        number:
          type: string
        cvv:
          type: integer
        expiration_year:
          type: integer
        expiration_month:
          type: integer
    Money:
      type: object
      required: [currency_code, units, nanos]
      properties:
        currency_code:
          type: string
        units:
          type: integer
          format: int64
        nanos:
          type: integer
          format: int32
