openapi: "3.0.0"
info:
  title: Recommendation Service
  version: "1.0"
paths:
  /recommendations:
    get:
      summary: Get product recommendations
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
components:
  schemas:
    Product:
      type: object
      required: [id, name, description, categories]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        categories:
          type: string
          enum:
            - clothing
            - accessories
            - footwear
            - decor
            - kitchen
            - vintage
            - garden
            - electronics
            - music
