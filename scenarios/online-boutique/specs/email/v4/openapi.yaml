openapi: "3.0.0"
info:
  title: Email Service
  version: "4.0"
  description: >
    Delivery notifications: emails now need the shipment reference
    (x-requires shipment-tracking). The guarantee quietly eroded back
    in checkout v6 — this upgrade is what exposes it.
paths:
  /send-order-confirmation:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              # order_id is schema-optional: every per-edge check tolerates
              # its absence. The x-requires annotation is what demands the
              # identity arrive present and non-null end-to-end.
              required: [email, order]
              properties:
                order_id:
                  type: string
                  x-requires: "order-identity"
                trace_id:
                  type: string
                  x-requires: "session-trace"
                shipment_ref:
                  type: string
                  x-requires: "shipment-tracking"
                email:
                  type: string
                  format: email
                order:
                  $ref: '#/components/schemas/OrderSummary'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                  delivery_estimate:
                    type: string
components:
  schemas:
    OrderSummary:
      type: object
      properties:
        order_id:
          type: string
        shipping_tracking_id:
          type: string
        shipping_cost:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          format: int32
    Money:
      type: object
      required: [currency_code, units, nanos]
      properties:
        currency_code:
          type: string
        units:
          type: integer
          format: int64
        nanos:
          type: integer
          format: int32
