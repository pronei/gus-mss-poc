openapi: "3.0.0"
info:
  title: Currency Service
  version: "4.0"
  description: >
    Money v2, contract phase: units/nanos are gone, amount is required,
    the request Money is CLOSED (unknown fields rejected), and memo may
    no longer be null. Callers must migrate first — the solver orders
    them ahead of currency.
paths:
  /convert:
    post:
      summary: Convert between currencies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversionRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Money'
  /currencies:
    get:
      summary: List supported currency codes
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
components:
  schemas:
    ConversionRequest:
      type: object
      required: [from, to_code]
      properties:
        from:
          $ref: '#/components/schemas/RequestMoney'
        to_code:
          type: string
        memo:
          type: string
    RequestMoney:
      type: object
      required: [currency_code, amount]
      additionalProperties: false
      properties:
        currency_code:
          type: string
        amount:
          type: number
    Money:
      type: object
      required: [currency_code, amount]
      properties:
        currency_code:
          type: string
        amount:
          type: number
