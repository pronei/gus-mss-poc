openapi: "3.0.0"
info:
  title: Payment Service
  version: "2.0"
  description: >
    Payment methods launch: accepts card OR wallet (oneOf), widens status with requires_action, and transaction_id may be null while a wallet charge is pending.
paths:
  /charge:
    post:
      summary: Process credit card charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ChargeRequest'
                - $ref: '#/components/schemas/WalletPayment'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeResult'
components:
  schemas:
    ChargeRequest:
      type: object
      required: [amount, credit_card]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        credit_card:
          $ref: '#/components/schemas/CreditCard'
    WalletPayment:
      type: object
      required: [amount, wallet_token]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        wallet_token:
          type: string
    ChargeResult:
      type: object
      required: [transaction_id, status]
      properties:
        transaction_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [approved, declined, requires_action]
    Money:
      type: object
      required: [currency_code, units, nanos]
      properties:
        currency_code:
          type: string
        units:
          type: integer
          format: int64
        nanos:
          type: integer
          format: int32
    CreditCard:
      type: object
      required: [number, cvv, expiration_year, expiration_month]
      properties:
        number:
          type: string
        cvv:
          type: integer
        expiration_year:
          type: integer
        expiration_month:
          type: integer
