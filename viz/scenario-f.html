<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GUS — Upgrade Safety</title>
<style>
  :root {
    --bg: #0c1c30; --bg2: #10253d; --panel: #152e4a; --panel2: #1b3a5c;
    --line: #24425f; --ink: #eee7d7; --muted: #8fa5bd; --faint: #5b7390;
    --accent: #e8833a; --ok: #4cc38a; --bad: #e5534b; --warn: #d9a03f;
    --up: #58a6ff; --chip: #0d2033;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    flex: none;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 14px 22px 10px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--bg2), var(--bg));
  }
  .brand { font: 700 15px var(--mono); color: var(--accent); letter-spacing: .12em; }
  h1 { font-size: 17px; font-weight: 650; }
  .verdict { font: 700 12px var(--mono); padding: 3px 12px; border-radius: 999px; letter-spacing: .08em; }
  .verdict.ok  { background: rgba(76,195,138,.14); color: var(--ok);  border: 1px solid rgba(76,195,138,.5); }
  .verdict.bad { background: rgba(229,83,75,.12);  color: var(--bad); border: 1px solid rgba(229,83,75,.5); }
  .htag { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .desc { flex-basis: 100%; color: var(--muted); font-size: 13px; max-width: 110ch; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(430px, 46%) 1fr; gap: 0; }
  @media (max-width: 1020px) {
    body { overflow: auto; }
    main { display: block; }
    #mesh-pane, #detail-pane { overflow: visible; height: auto; }
  }

  #mesh-pane { border-right: 1px solid var(--line); padding: 10px 8px 18px; position: relative; overflow-y: auto; }
  #mesh-hint { position: absolute; left: 20px; bottom: 12px; font: 11px var(--mono); color: var(--faint); }
  svg { width: 100%; height: auto; display: block; }
  .svc-box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .svc-box.up { stroke: var(--up); }
  .svc-box.excluded { stroke: var(--bad); stroke-dasharray: 5 3; }
  .svc-box.sel { stroke: var(--accent); stroke-width: 2; }
  .svc-name { font: 600 12.5px var(--sans); fill: var(--ink); }
  .svc-ver  { font: 10.5px var(--mono); fill: var(--muted); }
  .svc-ver .to-ok { fill: var(--up); } .svc-ver .to-bad { fill: var(--bad); text-decoration: line-through; }
  .svc-ver .excl-mark { fill: var(--bad); }
  .edge-path { fill: none; stroke-width: 1.4; cursor: pointer; }
  .edge-path.idle  { stroke: #274766; opacity: .55; }
  .edge-path.ok    { stroke: var(--ok); opacity: .85; }
  .edge-path.warn  { stroke: var(--warn); stroke-width: 2; }
  .edge-path.bad   { stroke: var(--bad); stroke-width: 2.4; }
  .edge-path.dim   { opacity: .14; }
  .edge-path.sel   { stroke-width: 3.4; filter: drop-shadow(0 0 4px rgba(232,131,58,.7)); }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
  .chain-overlay { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 3 5; opacity: .9; pointer-events: none; }

  #detail-pane { padding: 16px 22px 40px; overflow-y: auto; min-height: 0; }
  section { margin-bottom: 26px; }
  h2 { font: 700 11px var(--mono); color: var(--accent); letter-spacing: .18em; text-transform: uppercase;
       border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: 12px var(--mono); background: var(--chip); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; }
  .chip.safe { border-color: rgba(76,195,138,.55); color: var(--ok); }
  .chip.gone { border-color: rgba(229,83,75,.5); color: var(--bad); }
  .chip .v { color: var(--muted); }

  .stages { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .stage { background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  .stage b { font: 700 11px var(--mono); color: var(--accent); margin-right: 8px; }
  .stage span { font: 12.5px var(--mono); }
  .stage-arrow { color: var(--faint); font-size: 15px; }
  .order-note { color: var(--muted); font-size: 12px; margin-top: 6px; }

  .excl-row { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .excl-row:last-child { border-bottom: 0; }
  .excl-svc { font: 600 13px var(--mono); color: var(--bad); white-space: nowrap; }
  .excl-why { color: var(--muted); font-size: 12.5px; }
  .badge { display: inline-block; font: 700 10px var(--mono); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  .badge.deadlock { background: rgba(229,83,75,.15); color: var(--bad); border: 1px solid rgba(229,83,75,.45); }

  .edge-group { margin-bottom: 18px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .edge-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 14px; background: var(--panel); cursor: pointer; }
  .edge-head .route { font: 600 13px var(--mono); }
  .edge-head .ep { font: 11.5px var(--mono); color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); } .dot.ok { background: var(--ok); }
  .tier-note { font: 11px var(--sans); color: var(--faint); font-style: italic; flex-basis: 100%; }

  .vcard { padding: 12px 14px 13px; border-top: 1px solid var(--line); background: var(--bg2); }
  .vcard-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .sev { font: 700 10px var(--mono); letter-spacing: .1em; padding: 2px 8px; border-radius: 4px; }
  .sev.BREAK { background: rgba(229,83,75,.16); color: var(--bad); }
  .sev.WARN  { background: rgba(217,160,63,.16); color: var(--warn); }
  .sev.INFO  { background: rgba(88,166,255,.14); color: var(--up); }
  .rulename { font-weight: 650; font-size: 13px; }
  .ruleid { font: 11px var(--mono); color: var(--faint); }
  .conj { font: 700 10.5px var(--mono); color: var(--up); border: 1px solid rgba(88,166,255,.4); border-radius: 4px; padding: 1px 6px; margin-left: auto; }
  .window { font: 12.5px var(--mono); color: var(--muted); margin-bottom: 7px; }
  .window .old-side { color: var(--warn); } .window .new-side { color: var(--up); } .window .arr { color: var(--faint); }
  .explain { font-size: 13px; color: var(--ink); max-width: 92ch; margin-bottom: 9px; }
  .vmeta { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 12px var(--mono); color: var(--muted); max-width: 100%; }
  .vmeta > span { max-width: 100%; }
  .vmeta .k { color: var(--faint); margin-right: 6px; }
  .type-pill { background: var(--chip); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; color: var(--ink); word-break: break-all; display: inline; }
  .type-arr { color: var(--accent); margin: 0 4px; }

  .chain-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; background: var(--bg2); }
  .chain-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .chain-key { font: 700 12.5px var(--mono); color: var(--accent); }
  .chain-path { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font: 12.5px var(--mono); margin-bottom: 7px; }
  .hop { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; }
  .hop.culprit { border-color: rgba(229,83,75,.55); color: var(--bad); }
  .hop-arr { color: var(--faint); }
  .chain-msg { font-size: 12.5px; color: var(--muted); max-width: 92ch; }

  .empty { color: var(--faint); font-size: 13px; font-style: italic; }
  .allclear { border: 1px solid rgba(76,195,138,.4); border-radius: 10px; padding: 14px 16px; color: var(--ok); background: rgba(76,195,138,.06); font-size: 13.5px; }
  #nodata { padding: 60px 24px; text-align: center; color: var(--muted); font: 14px var(--mono); }
  #nodata code { color: var(--accent); }
</style>
</head>
<body>
<header id="hdr" hidden>
  <span class="brand">GUS/MSS</span>
  <h1 id="t-name"></h1>
  <span id="t-verdict" class="verdict"></span>
  <span id="t-coercion" class="htag" hidden></span>
  <p class="desc" id="t-desc"></p>
</header>

<div id="nodata" hidden>
  no artifact embedded — build one with<br><br>
  <code>gus viz --graph graph.yaml --scenario scenario.yaml --html out.html</code>
</div>

<main id="main" hidden>
  <div id="mesh-pane">
    <svg id="mesh" viewBox="0 0 640 560" role="img" aria-label="service mesh"></svg>
    <div id="mesh-hint">click an edge or service to filter · click background to clear</div>
  </div>
  <div id="detail-pane">
    <section id="sec-plan">
      <h2>Deployment plan</h2>
      <div id="plan"></div>
    </section>
    <section id="sec-findings">
      <h2>Findings</h2>
      <div id="findings"></div>
    </section>
    <section id="sec-chains" hidden>
      <h2>Data-flow chains</h2>
      <div id="chains"></div>
    </section>
  </div>
</main>

<script type="application/json" id="viz-data">{"scenario":{"name":"Scenario F: Recursive category tree","description":"ProductCatalog v3 replaces the flat categories string enum with a recursive Category{name, children: [Category]} object tree. This is a type kind change (enum -\u003e array) that exercises the coinductive Ref handling in the compat checker. JSON Schema validators can validate documents against either schema version, but cannot compare the two versions for cross-version compatibility during rolling deployment.\n","baseline":{"frontend":"v1","productcatalog":"v1"},"upgrades":{"productcatalog":"v3"}},"services":[{"id":"cart","baseline_version":"v1","current_version":"v1","is_upgrading":false,"is_excluded":false},{"id":"checkout","baseline_version":"v1","current_version":"v1","is_upgrading":false,"is_excluded":false},{"id":"currency","baseline_version":"v1","current_version":"v1","is_upgrading":false,"is_excluded":false},{"id":"email","baseline_version":"v1","current_version":"v1","is_upgrading":false,"is_excluded":false},{"id":"frontend","baseline_version":"v1","current_version":"v1","is_upgrading":false,"is_excluded":false},{"id":"payment","baseline_version":"v1","current_version":"v1","is_upgrading":false,"is_excluded":false},{"id":"productcatalog","baseline_version":"v1","current_version":"v3","is_upgrading":true,"is_excluded":true,"status_reason":"breaks edge frontend-\u003eproductcatalog [C3]: old frontend instances persist"},{"id":"recommendation","baseline_version":"v1","current_version":"v1","is_upgrading":false,"is_excluded":false},{"id":"shipping","baseline_version":"v1","current_version":"v1","is_upgrading":false,"is_excluded":false}],"edges":[{"name":"frontend-\u003echeckout","from":"frontend","to":"checkout","method":"POST","path":"/placeorder","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"frontend-\u003eshipping-quote","from":"frontend","to":"shipping","method":"POST","path":"/shipping/quote","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"frontend-\u003eproductcatalog","from":"frontend","to":"productcatalog","method":"GET","path":"/products","affected_by_upgrade":true,"ok":false,"failed_conjuncts":["C3"],"caller_spec_used":false,"violations":[{"conjunct":"3","rule":"kind-mismatch","path":"$[*].categories","severity":"BREAK","message":"type kind enum is not admitted where array is declared","old_type":"enum{clothing,accessories,footwear,decor,kitchen,vintage,garden,electronics,music}","new_type":"array(object(open){name*:string, children:array(ref(productcatalog.Category))})","explanation":"Type kind for categories changed fundamentally (enum{clothing,accessories,footwear,decor,kitchen,vintage,garden,electronics,music} vs array(object(open){name*:string, children:array(ref(productcatalog.Category))})) — no pairing direction can bridge the change."}]},{"name":"frontend-\u003ecurrency","from":"frontend","to":"currency","method":"POST","path":"/convert","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"frontend-\u003ecart","from":"frontend","to":"cart","method":"GET","path":"/cart","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"frontend-\u003erecommendation","from":"frontend","to":"recommendation","method":"GET","path":"/recommendations","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"checkout-\u003eshipping-quote","from":"checkout","to":"shipping","method":"POST","path":"/shipping/quote","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"checkout-\u003eshipping-ship","from":"checkout","to":"shipping","method":"POST","path":"/shipping/ship","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"checkout-\u003eemail","from":"checkout","to":"email","method":"POST","path":"/send-order-confirmation","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"checkout-\u003eproductcatalog","from":"checkout","to":"productcatalog","method":"GET","path":"/products/{id}","affected_by_upgrade":true,"ok":false,"failed_conjuncts":["C3"],"caller_spec_used":false,"violations":[{"conjunct":"3","rule":"kind-mismatch","path":"$.categories","severity":"BREAK","message":"type kind enum is not admitted where array is declared","old_type":"enum{clothing,accessories,footwear,decor,kitchen,vintage,garden,electronics,music}","new_type":"array(object(open){name*:string, children:array(ref(productcatalog.Category))})","explanation":"Type kind for categories changed fundamentally (enum{clothing,accessories,footwear,decor,kitchen,vintage,garden,electronics,music} vs array(object(open){name*:string, children:array(ref(productcatalog.Category))})) — no pairing direction can bridge the change."}]},{"name":"checkout-\u003ecurrency","from":"checkout","to":"currency","method":"POST","path":"/convert","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"checkout-\u003ecart","from":"checkout","to":"cart","method":"GET","path":"/cart","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"checkout-\u003epayment","from":"checkout","to":"payment","method":"POST","path":"/charge","affected_by_upgrade":false,"ok":true,"caller_spec_used":false},{"name":"recommendation-\u003eproductcatalog","from":"recommendation","to":"productcatalog","method":"GET","path":"/products","affected_by_upgrade":true,"ok":false,"failed_conjuncts":["C3"],"caller_spec_used":false,"violations":[{"conjunct":"3","rule":"kind-mismatch","path":"$[*].categories","severity":"BREAK","message":"type kind enum is not admitted where array is declared","old_type":"enum{clothing,accessories,footwear,decor,kitchen,vintage,garden,electronics,music}","new_type":"array(object(open){name*:string, children:array(ref(productcatalog.Category))})","explanation":"Type kind for categories changed fundamentally (enum{clothing,accessories,footwear,decor,kitchen,vintage,garden,electronics,music} vs array(object(open){name*:string, children:ar <script>
"use strict";

/* ---------- rule metadata: legible names ---------- */
const RULES = {
  "REQ.1":  "required field missing",
  "REQ.2":  "optional became load-bearing",
  "REQ.4":  "unknown field rejected",
  "RES.1":  "expected field gone",
  "RES.4":  "guarantee weakened",
  "RES.5":  "unexpected field",
  "enum-request-narrowing":  "accepted values narrowed",
  "enum-response-widening":  "returned values widened",
  "enum-prim-mismatch":      "enum outgrew its type",
  "prim-mismatch":     "primitive type change",
  "kind-mismatch":     "type shape change",
  "presence-mismatch": "schema appeared/vanished",
  "nullable-request-narrowing": "null no longer accepted",
  "nullable-response-widening": "null now possible",
  "union-request-narrowing": "variant no longer accepted",
  "union-response-widening": "variant not understood",
  "map-key-mismatch":  "map key type change",
  "format-change":     "range risk",
  "literal-mismatch":  "constant changed",
  "literal-not-in-enum": "constant rejected",
  "literal-widening":  "constant became variable",
  "literal-narrowing": "only one value accepted",
  "literal-prim-mismatch": "constant wrong type",
  "ref-name-mismatch": "recursive type renamed",
  "chain-weakened":      "identity no longer guaranteed",
  "chain-nullable":      "identity may be null",
  "chain-type-mismatch": "identity changed type",
  "chain-field-missing": "identity lost at a hop",
  "chain-no-path":       "no route for identity",
};
const ruleName = r => RULES[r] || r;

/* Which mixed-version window a conjunct describes. */
function windowParts(conj, from, to) {
  switch (conj) {
    case "1":   return ["old " + from, "calls", "new " + to, "request leg"];
    case "2":   return ["new " + from, "calls", "old " + to, "request leg"];
    case "3":   return ["new " + to, "answers", "old " + from, "response leg"];
    case "4":   return ["old " + to, "answers", "new " + from, "response leg"];
    case "TGT": return ["new " + from, "with", "new " + to, "steady state after the roll"];
    default:    return [from, "→", to, ""];
  }
}
const isOldSide = s => s.startsWith("old ");

/* ---------- boot ---------- */
let DATA = null;
try { DATA = JSON.parse(document.getElementById("viz-data").textContent); } catch (e) { DATA = null; }
let selected = null; // {kind:"edge"|"svc", id}
if (!DATA || !DATA.scenario) {
  document.getElementById("nodata").hidden = false;
} else {
  document.getElementById("hdr").hidden = false;
  document.getElementById("main").hidden = false;
  render(DATA);
}

function render(d) {
  document.getElementById("t-name").textContent = d.scenario.name || "scenario";
  document.getElementById("t-desc").textContent = (d.scenario.description || "").trim();
  const ok = d.edges.every(e => e.ok) && (d.chains || []).every(c => c.ok);
  const v = document.getElementById("t-verdict");
  v.textContent = ok ? "SAFE TO ROLL" : "HAZARDS FOUND";
  v.className = "verdict " + (ok ? "ok" : "bad");
  if (d.scenario.coercion === "lenient") {
    const t = document.getElementById("t-coercion");
    t.hidden = false; t.textContent = "lenient coercion profile";
  }
  drawMesh(d);
  drawPlan(d);
  drawFindings(d);
  drawChains(d);
}

/* ---------- mesh ---------- */
function drawMesh(d) {
  const svg = document.getElementById("mesh");
  svg.innerHTML = "";
  const W = 640, H = 560, cx = W / 2, cy = H / 2 + 6, R = Math.min(W, H) / 2 - 78;
  const svcs = d.services.map(s => s.id).sort();
  const pos = {};
  svcs.forEach((id, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / svcs.length;
    pos[id] = { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
  });
  const svcById = Object.fromEntries(d.services.map(s => [s.id, s]));
  const NS = "http://www.w3.org/2000/svg";
  const el = (n, attrs, parent) => {
    const e = document.createElementNS(NS, n);
    for (const k of Object.keys(attrs)) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e); return e;
  };

  const defs = el("defs", {});
  [["arr-idle", "#274766"], ["arr-ok", "#4cc38a"], ["arr-warn", "#d9a03f"], ["arr-bad", "#e5534b"]].forEach(pair => {
    const m = el("marker", { id: pair[0], viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6.5, markerHeight: 6.5, orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: pair[1] }, m);
  });

  const edgeState = e => !e.affected_by_upgrade ? "idle"
    : !e.ok ? "bad"
    : (e.violations || []).some(v => v.severity === "WARN") ? "warn" : "ok";

  const chainHops = new Set();
  (d.chains || []).forEach(c => {
    for (let i = 0; i + 1 < (c.path || []).length; i++) chainHops.add(c.path[i] + "->" + c.path[i + 1]);
  });

  const gEdges = el("g", {});
  d.edges.forEach(e => {
    const p1 = pos[e.from], p2 = pos[e.to];
    if (!p1 || !p2) return;
    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const a = { x: p1.x + ux * 54, y: p1.y + uy * 24 };
    const b = { x: p2.x - ux * 54, y: p2.y - uy * 24 };
    const mid = { x: (a.x + b.x) / 2 + (cx - (a.x + b.x) / 2) * 0.22, y: (a.y + b.y) / 2 + (cy - (a.y + b.y) / 2) * 0.22 };
    const dPath = "M " + a.x + "," + a.y + " Q " + mid.x + "," + mid.y + " " + b.x + "," + b.y;
    const st = edgeState(e);
    if (chainHops.has(e.from + "->" + e.to))
      el("path", { d: dPath, class: "chain-overlay", transform: "translate(0,-5)" }, gEdges);
    const path = el("path", { d: dPath, class: "edge-path " + st, "marker-end": "url(#arr-" + st + ")", "data-edge": e.name }, gEdges);
    el("title", {}, path).textContent = e.name + " · " + (e.method || "") + " " + (e.path || "");
    const hit = el("path", { d: dPath, class: "edge-hit" }, gEdges);
    hit.addEventListener("click", ev => { ev.stopPropagation(); select({ kind: "edge", id: e.name }); });
  });

  const gNodes = el("g", {});
  svcs.forEach(id => {
    const s = svcById[id], p = pos[id];
    const g = el("g", { "data-svc": id, cursor: "pointer" }, gNodes);
    const w = Math.max(100, id.length * 8 + 28), h = 44;
    const cls = ["svc-box", s.is_upgrading ? "up" : "", s.is_excluded ? "excluded" : ""].join(" ").trim();
    el("rect", { x: p.x - w / 2, y: p.y - h / 2, width: w, height: h, rx: 9, class: cls }, g);
    el("text", { x: p.x, y: p.y - 3, "text-anchor": "middle", class: "svc-name" }, g).textContent = id;
    const ver = el("text", { x: p.x, y: p.y + 14, "text-anchor": "middle", class: "svc-ver" }, g);
    if (s.is_upgrading) {
      el("tspan", {}, ver).textContent = s.baseline_version + " → ";
      el("tspan", { class: s.is_excluded ? "to-bad" : "to-ok" }, ver).textContent = s.current_version;
      if (s.is_excluded) el("tspan", { class: "excl-mark" }, ver).textContent = " ✕";
    } else ver.textContent = s.baseline_version;
    g.addEventListener("click", ev => { ev.stopPropagation(); select({ kind: "svc", id: id }); });
  });

  svg.addEventListener("click", () => select(null));
}

function select(sel) {
  selected = sel;
  document.querySelectorAll(".edge-path").forEach(p => {
    const name = p.getAttribute("data-edge");
    p.classList.remove("sel", "dim");
    if (!selected) return;
    const e = DATA.edges.find(x => x.name === name);
    const match = selected.kind === "edge" ? name === selected.id
      : (e && (e.from === selected.id || e.to === selected.id));
    p.classList.add(match ? "sel" : "dim");
  });
  document.querySelectorAll("[data-svc] .svc-box").forEach(r => r.classList.remove("sel"));
  if (selected && selected.kind === "svc") {
    const g = document.querySelector('[data-svc="' + CSS.escape(selected.id) + '"] .svc-box');
    if (g) g.classList.add("sel");
  }
  drawFindings(DATA);
}

/* ---------- deployment plan ---------- */
function drawPlan(d) {
  const root = document.getElementById("plan");
  root.innerHTML = "";
  const mss = d.mss || {};
  const chips = document.createElement("div");
  chips.className = "chips";
  (mss.safe || []).forEach(u => chips.appendChild(chip(esc(u.service) + ' <span class="v">' + esc(u.from_ver) + "→" + esc(u.to_ver) + "</span>", "safe")));
  (mss.removed || []).forEach(u => chips.appendChild(chip(esc(u.service) + ' <span class="v">stays ' + esc(u.from_ver) + "</span>", "gone")));
  if (!chips.children.length) chips.appendChild(chip("no upgrades proposed", ""));
  root.appendChild(chips);

  if ((mss.order || []).length > 1) {
    const st = document.createElement("div");
    st.className = "stages";
    mss.order.forEach((stage, i) => {
      if (i) { const a = document.createElement("span"); a.className = "stage-arrow"; a.textContent = "→"; st.appendChild(a); }
      const s = document.createElement("div"); s.className = "stage";
      s.innerHTML = "<b>" + (i + 1) + "</b><span>" + esc(stage.join(", ")) + "</span>";
      st.appendChild(s);
    });
    root.appendChild(st);
    const note = document.createElement("div");
    note.className = "order-note";
    note.textContent = "each stage must fully roll out before the next starts";
    root.appendChild(note);
  }

  if ((mss.removed || []).length) {
    const list = document.createElement("div");
    list.style.marginTop = "14px";
    mss.removed.forEach(u => {
      const row = document.createElement("div");
      row.className = "excl-row";
      const why = prettifyReason(u.reason || "");
      row.innerHTML = '<span class="excl-svc">' + esc(u.service) +
        (why.deadlock ? '<span class="badge deadlock">⟳ deadlock</span>' : "") + "</span>" +
        '<span class="excl-why">' + esc(why.text) + "</span>";
      list.appendChild(row);
    });
    root.appendChild(list);
  }
}

function prettifyReason(r) {
  if (/deadlock/i.test(r)) return { deadlock: true, text: "its rollout-order constraints with a co-shipped upgrade form a cycle — no rolling order works; ship separately or switch over atomically" };
  const text = r
    .replace(/^breaks edge /, "would break ")
    .replace(/^breaks data-flow chain /, "would break data-flow chain ")
    .replace(/\[C1\]/, "(old-caller request window)").replace(/\[C2\]/, "(new-caller request window)")
    .replace(/\[C3\]/, "(response to old caller)").replace(/\[C4\]/, "(response to new caller)")
    .replace(/\[TGT\]/, "(final state)");
  return { deadlock: false, text: text };
}

function chip(html, cls) {
  const c = document.createElement("span");
  c.className = ("chip " + cls).trim(); c.innerHTML = html; return c;
}

/* ---------- findings ---------- */
function drawFindings(d) {
  const root = document.getElementById("findings");
  root.innerHTML = "";
  let edges = d.edges.filter(e => (e.violations || []).length);
  if (selected) {
    edges = edges.filter(e => selected.kind === "edge" ? e.name === selected.id
      : (e.from === selected.id || e.to === selected.id));
  }
  const brokenChains = (d.chains || []).filter(c => !c.ok);
  if (!edges.length && !brokenChains.length && !selected) {
    root.innerHTML = '<div class="allclear">Every cross-version pairing and data-flow chain holds. Nothing blocks this batch.</div>';
    return;
  }
  if (!edges.length) {
    root.innerHTML = '<div class="empty">no edge findings' + (selected ? " for this selection" : "") +
      (brokenChains.length ? " — see data-flow chains below" : "") + "</div>";
    return;
  }
  edges.forEach(e => root.appendChild(edgeGroup(e)));
}

function edgeGroup(e) {
  const g = document.createElement("div");
  g.className = "edge-group";
  const worst = !e.ok ? "bad" : "warn";
  const head = document.createElement("div");
  head.className = "edge-head";
  head.innerHTML = '<span class="dot ' + worst + '"></span>' +
    '<span class="route">' + esc(e.from) + " → " + esc(e.to) + "</span>" +
    '<span class="ep">' + esc(e.method || "") + " " + esc(e.path || "") + "</span>" +
    (e.caller_spec_used ? "" : '<span class="tier-note">caller contract not declared — assumed pinned to the provider’s previous contract (Tier-3)</span>');
  head.addEventListener("click", () => select({ kind: "edge", id: e.name }));
  g.appendChild(head);
  (e.violations || []).forEach(v => g.appendChild(vcard(e, v)));
  return g;
}

function vcard(e, v) {
  const c = document.createElement("div");
  c.className = "vcard";
  const parts = windowParts(v.conjunct, e.from, e.to);
  const l = parts[0], verb = parts[1], r = parts[2], leg = parts[3];
  const sideCls = s => isOldSide(s) ? "old-side" : "new-side";
  const field = fieldLabel(v.path);
  c.innerHTML =
    '<div class="vcard-top">' +
      '<span class="sev ' + esc(v.severity) + '">' + esc(v.severity) + "</span>" +
      '<span class="rulename">' + esc(ruleName(v.rule)) + "</span>" +
      '<span class="ruleid">' + esc(v.rule) + "</span>" +
      (v.conjunct ? '<span class="conj" title="which cross-version pairing this hits">' +
        (v.conjunct === "TGT" ? "TGT" : "C" + esc(v.conjunct)) + "</span>" : "") +
    "</div>" +
    '<div class="window"><span class="' + sideCls(l) + '">' + esc(l) + '</span> <span class="arr">' + esc(verb) + '</span> <span class="' + sideCls(r) + '">' + esc(r) + "</span>" +
      (leg ? ' <span class="arr">· ' + esc(leg) + "</span>" : "") + "</div>" +
    '<div class="explain">' + esc(v.explanation || v.message) + "</div>" +
    '<div class="vmeta">' +
      (field ? '<span><span class="k">field</span>' + esc(field) + "</span>" : "") +
      (v.old_type || v.new_type
        ? '<span><span class="k">was</span><span class="type-pill">' + esc(v.old_type || "—") +
          '</span><span class="type-arr">→</span><span class="k">becomes</span><span class="type-pill">' + esc(v.new_type || "—") + "</span></span>"
        : "") +
    "</div>";
  return c;
}

function fieldLabel(p) {
  if (!p) return "";
  const s = p.replace(/^\$\.?/, "").replace(/\[\*\]/g, "[]");
  return s === "" ? "(whole body)" : s;
}

/* ---------- chains ---------- */
function drawChains(d) {
  const chains = d.chains || [];
  if (!chains.length) return;
  document.getElementById("sec-chains").hidden = false;
  const root = document.getElementById("chains");
  root.innerHTML = "";
  chains.forEach(c => {
    const card = document.createElement("div");
    card.className = "chain-card";
    const culprits = new Set(c.culprits || []);
    const hops = (c.path || []).map(h =>
      '<span class="hop ' + (culprits.has(h) ? "culprit" : "") + '">' + esc(h) + "</span>"
    ).join('<span class="hop-arr">▸</span>');
    card.innerHTML =
      '<div class="chain-top">' +
        '<span class="dot ' + (c.ok ? "ok" : "bad") + '"></span>' +
        '<span class="chain-key">' + esc(c.key) + "</span>" +
        (c.ok ? '<span class="ruleid">intact</span>'
              : '<span class="rulename">' + esc(ruleName(c.rule)) + '</span><span class="ruleid">' + esc(c.rule) + "</span>") +
      "</div>" +
      '<div class="chain-path">' + hops + "</div>" +
      '<div class="chain-msg">' + esc(c.message || "") + "</div>";
    root.appendChild(card);
  });
}

/* ---------- utils ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, ch =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
}
</script>
