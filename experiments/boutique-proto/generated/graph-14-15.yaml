      method: POST
      name: frontend->checkout-PlaceOrder
      path: /hipstershop.CheckoutService/PlaceOrder
      to: checkout
    - from: frontend
      method: POST
      name: frontend->ad-GetAds
      path: /hipstershop.AdService/GetAds
