      method: POST
      name: checkout->shipping-ShipOrder
      path: /hipstershop.ShippingService/ShipOrder
      to: shipping
    - from: checkout
      method: POST
      name: checkout->payment-Charge
      path: /hipstershop.PaymentService/Charge
      to: payment
    - from: checkout
      method: POST
      name: checkout->email-SendOrderConfirmation
      path: /hipstershop.EmailService/SendOrderConfirmation
      to: email
    - from: recommendation
      method: POST
      name: recommendation->productcatalog-ListProducts
      path: /hipstershop.ProductCatalogService/ListProducts
      to: productcatalog
