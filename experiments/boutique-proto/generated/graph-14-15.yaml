edges:
    - from: frontend
      method: POST
      name: frontend->cart-AddItem
      path: /hipstershop.CartService/AddItem
      to: cart
    - from: frontend
      method: POST
      name: frontend->cart-GetCart
      path: /hipstershop.CartService/GetCart
      to: cart
    - from: frontend
      method: POST
      name: frontend->cart-EmptyCart
      path: /hipstershop.CartService/EmptyCart
      to: cart
