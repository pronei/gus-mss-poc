      method: POST
      name: checkout->cart-GetCart
      path: /hipstershop.CartService/GetCart
      to: cart
    - from: checkout
      method: POST
      name: checkout->cart-EmptyCart
      path: /hipstershop.CartService/EmptyCart
      to: cart
    - from: checkout
      method: POST
      name: checkout->productcatalog-GetProduct
      path: /hipstershop.ProductCatalogService/GetProduct
      to: productcatalog
    - from: checkout
      method: POST
      name: checkout->currency-Convert
      path: /hipstershop.CurrencyService/Convert
      to: currency
    - from: checkout
      method: POST
      name: checkout->shipping-GetQuote
      path: /hipstershop.ShippingService/GetQuote
      to: shipping
